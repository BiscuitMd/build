name: Native Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Build APK
        run: |
          cd ${{ github.event.inputs.target_dir }}
          chmod +x gradlew
          ./gradlew assembleRelease
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ github.event.inputs.target_dir }}/app/build/outputs/apk/release/app-release.apk
