name: Native Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory (folder tempat zip)'
        required: true
        type: string
      zip_file:
        description: 'Nama file zip project'
        required: false
        default: 'project.zip'
        type: string
      build_task:
        description: 'Gradle task'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
          - bundleDebug
      build_flavor:
        description: 'Product flavor (kosongkan kalau tidak ada)'
        required: false
        default: ''
        type: string
      java_version:
        description: 'Versi Java'
        required: false
        default: '17'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Target Directory
        id: validate
        run: |
          echo "::group::Validate"
          TARGET="${{ github.event.inputs.target_dir }}"
          ZIP="${{ github.event.inputs.zip_file }}"

          if [ ! -d "$TARGET" ]; then
            echo "::error::Target directory tidak ditemukan: $TARGET"
            exit 1
          fi

          if [ ! -f "$TARGET/$ZIP" ]; then
            echo "::error::File zip tidak ditemukan: $TARGET/$ZIP"
            ls -la "$TARGET" || true
            exit 1
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "✓ Validation OK"
          echo "::endgroup::"

      - name: Extract Project Zip
        id: extract
        run: |
          echo "::group::Extract"
          TARGET="${{ steps.validate.outputs.target }}"
          ZIP="${{ steps.validate.outputs.zip }}"
          EXTRACT_DIR="$TARGET/project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -o "$TARGET/$ZIP" -d "$EXTRACT_DIR"

          echo "::group::Extracted Files"
          ls -la "$EXTRACT_DIR"
          echo "::endgroup::"

          echo "extract_dir=$EXTRACT_DIR" >> $GITHUB_OUTPUT
          echo "✓ Extract OK"
          echo "::endgroup::"

      - name: Detect Gradle Project Root
        id: detect
        run: |
          echo "::group::Detect Project Root"
          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          ROOT=""

          if [ -f "$EXTRACT_DIR/settings.gradle" ] || [ -f "$EXTRACT_DIR/settings.gradle.kts" ]; then
            ROOT="$EXTRACT_DIR"
          elif [ -f "$EXTRACT_DIR/build.gradle" ] || [ -f "$EXTRACT_DIR/build.gradle.kts" ]; then
            ROOT="$EXTRACT_DIR"
          elif [ -f "$EXTRACT_DIR/gradlew" ]; then
            ROOT="$EXTRACT_DIR"
          else
            FOUND=$(find "$EXTRACT_DIR" -maxdepth 4 \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "gradlew" \
              \) -type f -not -path "*/node_modules/*" -not -path "*/build/*" | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "::error::Project Gradle tidak ditemukan"
              find "$EXTRACT_DIR" -maxdepth 3 -type f | head -n 50
              exit 1
            fi

            ROOT=$(dirname "$FOUND")
          fi

          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✓ Project root: $ROOT"

          echo "::group::Project Structure"
          ls -la "$ROOT" | head -n 30
          echo "::endgroup::"
          echo "::endgroup::"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ github.event.inputs.java_version }}

      - name: Setup Android SDK
        run: |
          echo "::group::Setup Android SDK"
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools-tmp cmdline-tools.zip

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "✓ Android SDK setup OK"
          echo "::endgroup::"

      - name: Accept Licenses & Install SDK Packages
        run: |
          echo "::group::Install SDK Packages"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "platforms;android-33" \
                     "build-tools;33.0.1" \
                     "platforms;android-32" \
                     "build-tools;32.0.0" || true
          echo "✓ SDK packages installed"
          echo "::endgroup::"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Auto-Generate Missing Icons
        id: gen_icons
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Auto-Generate Missing Icons"

          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          # Cari AndroidManifest.xml
          MANIFEST=$(find . -name "AndroidManifest.xml" -path "*/main/*" -type f | head -n 1)
          if [ -z "$MANIFEST" ]; then
            echo "::error::AndroidManifest.xml tidak ditemukan"
            exit 1
          fi

          echo "✓ Manifest: $MANIFEST"
          RES_DIR=$(dirname "$MANIFEST")/res

          if [ ! -d "$RES_DIR" ]; then
            echo "::error::res/ folder tidak ditemukan"
            exit 1
          fi

          echo "✓ Res dir: $RES_DIR"

          # Extract semua nama icon dari manifest
          ICONS=$(grep -oE '@mipmap/[a-zA-Z0-9_]+' "$MANIFEST" | sed 's|@mipmap/||' | sort -u)

          echo "Icons yang dibutuhin:"
          echo "$ICONS"
          echo ""

          # Generate PNG untuk tiap icon di tiap density
          for icon in $ICONS; do
            for density_size in "mdpi:48" "hdpi:72" "xhdpi:96" "xxhdpi:144" "xxxhdpi:192"; do
              density=$(echo "$density_size" | cut -d: -f1)
              size=$(echo "$density_size" | cut -d: -f2)
              target_dir="$RES_DIR/mipmap-$density"
              target_file="$target_dir/$icon.png"

              if [ -f "$target_file" ]; then
                echo "✓ $target_file (exists)"
                continue
              fi

              mkdir -p "$target_dir"

              # Buat placeholder PNG (kotak putih dengan huruf pertama icon name)
              INITIAL=$(echo "$icon" | head -c 1 | tr '[:lower:]' '[:upper:]')

              # Warna random berdasarkan nama icon (biar beda-beda)
              case "$icon" in
                *instagram*) COLOR="#E1306C" ;;
                *youtube*)   COLOR="#FF0000" ;;
                *whatsapp*)  COLOR="#25D366" ;;
                *telegram*)  COLOR="#0088CC" ;;
                *nxxx*)      COLOR="#FF6B9D" ;;
                *round*)     COLOR="#4A90E2" ;;
                *launcher*)  COLOR="#10B981" ;;
                *)           COLOR="#3B82F6" ;;
              esac

              convert -size ${size}x${size} "xc:$COLOR" \
                -gravity center \
                -pointsize $((size / 2)) \
                -fill white \
                -font DejaVu-Sans-Bold \
                -annotate +0+0 "$INITIAL" \
                "$target_file"

              echo "✓ Generated: $target_file"
            done
          done

          echo ""
          echo "::group::Final res structure"
          find "$RES_DIR" -type f -name "*.png" | head -n 50
          echo "::endgroup::"

          echo "✓ All icons generated"
          echo "::endgroup::"

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Prepare Gradle Wrapper"
          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar missing — generating..."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew missing — generating..."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

          chmod +x gradlew
          echo "::endgroup::"

      - name: Fix local.properties
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Fix local.properties"
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          echo "::endgroup::"

      - name: Build with Gradle
        id: gradle_build
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Gradle Build"
          TASK="${{ github.event.inputs.build_task }}"
          FLAVOR="${{ github.event.inputs.build_flavor }}"

          if [ -n "$FLAVOR" ]; then
            CAP_FLAVOR="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            FINAL_TASK="${TASK}${CAP_FLAVOR}"
          else
            FINAL_TASK="$TASK"
          fi

          echo "Running: ./gradlew $FINAL_TASK"
          ./gradlew "$FINAL_TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "Exit code: $EXIT_CODE"
          echo "::endgroup::"
          exit $EXIT_CODE

      - name: Show Gradle Error
        if: failure()
        run: |
          echo "::group::Gradle Error (Last 100 lines)"
          if [ -f /tmp/gradle.log ]; then
            tail -n 100 /tmp/gradle.log
          fi
          echo "::endgroup::"

      - name: Locate APK/AAB
        id: locate
        if: success()
        run: |
          ROOT="${{ steps.detect.outputs.root }}"
          APKS=$(find "$ROOT/app/build/outputs/apk" -name "*.apk" -type f 2>/dev/null)
          AABS=$(find "$ROOT/app/build/outputs/bundle" -name "*.aab" -type f 2>/dev/null)

          if [ -z "$APKS" ] && [ -z "$AABS" ]; then
            echo "::error::Tidak ada APK/AAB"
            exit 1
          fi

          echo "apks<<EOF" >> $GITHUB_OUTPUT
          echo "$APKS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "aabs<<EOF" >> $GITHUB_OUTPUT
          echo "$AABS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Upload APK
        if: success() && steps.locate.outputs.apks != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ steps.detect.outputs.root }}/app/build/outputs/apk/**/*.apk
          retention-days: 7

      - name: Upload AAB
        if: success() && steps.locate.outputs.aabs != ''
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: ${{ steps.detect.outputs.root }}/app/build/outputs/bundle/**/*.aab
          retention-days: 7

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Generate Build Info
        if: always()
        run: |
          {
            echo "=== NATIVE BUILD INFO ==="
            echo "Job ID: ${{ github.run_id }}"
            echo "Build Task: ${{ github.event.inputs.build_task }}"
            echo "Project Root: ${{ steps.detect.outputs.root }}"
            echo "Finished: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt

      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Native Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Job ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Task | ${{ github.event.inputs.build_task }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ github.event.inputs.java_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
