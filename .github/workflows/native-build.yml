name: Native Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory (folder tempat zip)'
        required: true
        type: string
      zip_file:
        description: 'Nama file zip project'
        required: false
        default: 'project.zip'
        type: string
      build_task:
        description: 'Gradle task'
        required: false
        default: 'assembleRelease'
        type: choice
        options:
          - assembleRelease
          - assembleDebug
          - bundleRelease
          - bundleDebug
      build_flavor:
        description: 'Product flavor (kosongkan kalau tidak ada)'
        required: false
        default: ''
        type: string
      java_version:
        description: 'Versi Java'
        required: false
        default: '17'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate Target Directory
        id: validate
        run: |
          echo "::group::Validate"
          TARGET="${{ github.event.inputs.target_dir }}"
          ZIP="${{ github.event.inputs.zip_file }}"

          if [ ! -d "$TARGET" ]; then
            echo "::error::Target directory tidak ditemukan: $TARGET"
            exit 1
          fi

          if [ ! -f "$TARGET/$ZIP" ]; then
            echo "::error::File zip tidak ditemukan: $TARGET/$ZIP"
            echo "Isi folder $TARGET:"
            ls -la "$TARGET" || true
            exit 1
          fi

          echo "target=$TARGET" >> $GITHUB_OUTPUT
          echo "zip=$ZIP" >> $GITHUB_OUTPUT
          echo "✓ Validation OK"
          echo "::endgroup::"

      - name: Extract Project Zip
        id: extract
        run: |
          echo "::group::Extract"
          TARGET="${{ steps.validate.outputs.target }}"
          ZIP="${{ steps.validate.outputs.zip }}"
          EXTRACT_DIR="$TARGET/project"

          rm -rf "$EXTRACT_DIR"
          mkdir -p "$EXTRACT_DIR"

          unzip -o "$TARGET/$ZIP" -d "$EXTRACT_DIR"

          echo "::group::Extracted Files"
          ls -la "$EXTRACT_DIR"
          echo "::endgroup::"

          echo "extract_dir=$EXTRACT_DIR" >> $GITHUB_OUTPUT
          echo "✓ Extract OK"
          echo "::endgroup::"

      - name: Detect Gradle Project Root
        id: detect
        run: |
          echo "::group::Detect Project Root"
          EXTRACT_DIR="${{ steps.extract.outputs.extract_dir }}"

          ROOT=""

          if [ -f "$EXTRACT_DIR/settings.gradle" ] || [ -f "$EXTRACT_DIR/settings.gradle.kts" ]; then
            ROOT="$EXTRACT_DIR"
          elif [ -f "$EXTRACT_DIR/build.gradle" ] || [ -f "$EXTRACT_DIR/build.gradle.kts" ]; then
            ROOT="$EXTRACT_DIR"
          elif [ -f "$EXTRACT_DIR/gradlew" ]; then
            ROOT="$EXTRACT_DIR"
          else
            FOUND=$(find "$EXTRACT_DIR" -maxdepth 4 \( \
              -name "settings.gradle" -o \
              -name "settings.gradle.kts" -o \
              -name "gradlew" \
              \) -type f -not -path "*/node_modules/*" -not -path "*/build/*" | head -n 1)

            if [ -z "$FOUND" ]; then
              echo "::error::Project Gradle tidak ditemukan"
              echo "Struktur zip lu:"
              find "$EXTRACT_DIR" -maxdepth 3 -type f | head -n 50
              exit 1
            fi

            ROOT=$(dirname "$FOUND")
          fi

          echo "root=$ROOT" >> $GITHUB_OUTPUT
          echo "✓ Project root: $ROOT"

          echo "::group::Project Structure"
          ls -la "$ROOT" | head -n 30
          echo "::endgroup::"
          echo "::endgroup::"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ github.event.inputs.java_version }}

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles(format('{0}/**/*.gradle*', steps.detect.outputs.root)) }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Setup Android SDK
        run: |
          echo "::group::Setup Android SDK"
          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk

          echo "Downloading cmdline-tools..."
          curl -sSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d cmdline-tools-tmp
          mv cmdline-tools-tmp/cmdline-tools cmdline-tools/latest
          rm -rf cmdline-tools-tmp cmdline-tools.zip

          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
          echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$HOME/android-sdk/platform-tools" >> $GITHUB_PATH
          echo "✓ Android SDK setup OK"
          echo "::endgroup::"

      - name: Accept Licenses & Install SDK Packages
        run: |
          echo "::group::Install SDK Packages"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" \
                     "platforms;android-34" \
                     "build-tools;34.0.0" \
                     "platforms;android-33" \
                     "build-tools;33.0.1" \
                     "platforms;android-32" \
                     "build-tools;32.0.0" || true
          echo "✓ SDK packages installed"
          echo "::endgroup::"

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.2

      - name: Prepare Gradle Wrapper
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Prepare Gradle Wrapper"

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle-wrapper.jar missing — generating..."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          else
            echo "✓ gradle-wrapper.jar ada"
          fi

          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew missing — generating..."
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

          chmod +x gradlew
          echo "✓ gradlew executable"

          echo "Isi folder gradle/wrapper:"
          ls -la gradle/wrapper/
          echo "::endgroup::"

      - name: Fix local.properties
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Fix local.properties"
          rm -f local.properties
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties
          echo "✓ local.properties OK"
          echo "::endgroup::"

      - name: Fix AndroidManifest (Auto-Patch Missing Resources)
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Auto-Patch AndroidManifest"

          MANIFEST="app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "⚠️ AndroidManifest.xml tidak ditemukan di $MANIFEST — skip"
            exit 0
          fi

          echo "Backup manifest..."
          cp "$MANIFEST" "$MANIFEST.bak"

          echo "--- Manifest SEBELUM ---"
          grep -oP 'android:(icon|roundIcon|theme|banner|logo)="[^"]*"' "$MANIFEST" | sort -u || true

          MIPMAP_DIR="app/src/main/res"
          ICON_DIRS=$(find "$MIPMAP_DIR" -maxdepth 1 -type d -name "mipmap*" 2>/dev/null || true)

          echo "--- Cek resource yang hilang ---"
          MISSING_REFS=$(grep -oP '@(mipmap|drawable|style|theme)/[A-Za-z0-9_]+' "$MANIFEST" | sort -u || true)

          if [ -n "$MISSING_REFS" ]; then
            echo "Referensi resource yang dipakai manifest:"
            echo "$MISSING_REFS"
          fi

          echo "--- Bikin placeholder resource kalau gaada ---"

          mkdir -p app/src/main/res/mipmap-anydpi-v26
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values

          MIPMAP_NAMES=$(grep -oP '@mipmap/\K[A-Za-z0-9_]+' "$MANIFEST" | sort -u || true)
          for NAME in $MIPMAP_NAMES; do
            if [ ! -f "app/src/main/res/mipmap-hdpi/$NAME.png" ] && \
               [ ! -f "app/src/main/res/mipmap-anydpi-v26/$NAME.xml" ] && \
               [ ! -f "app/src/main/res/drawable/$NAME.xml" ]; then
              echo "  ⚡ Placeholder XML untuk mipmap/$NAME"
              cat > "app/src/main/res/mipmap-anydpi-v26/$NAME.xml" <<EOF
<?xml version="1.0" encoding="utf-8"?>
<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
    <background android:drawable="@android:color/transparent"/>
    <foreground android:drawable="@android:color/transparent"/>
</adaptive-icon>
EOF
            fi
          done

          STYLE_REFS=$(grep -oP '@style/\K[A-Za-z0-9_]+' "$MANIFEST" | sort -u || true)
          if [ -n "$STYLE_REFS" ]; then
            cat > app/src/main/res/values/styles_autofix.xml <<EOF
<?xml version="1.0" encoding="utf-8"?>
<resources>
EOF
            for STYLE in $STYLE_REFS; do
              echo "    <style name=\"$STYLE\" parent=\"android:Theme.Material.Light.NoActionBar\"/>" >> app/src/main/res/values/styles_autofix.xml
            done
            echo "</resources>" >> app/src/main/res/values/styles_autofix.xml
            echo "  ✓ Bikin $STYLE_REFS di styles_autofix.xml"
          fi

          echo "--- Manifest SESUDAH ---"
          grep -oP 'android:(icon|roundIcon|theme|banner|logo)="[^"]*"' "$MANIFEST" | sort -u || true

          echo "✓ Auto-patch selesai"
          echo "::endgroup::"

      - name: Show Gradle Info
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Gradle Version"
          ./gradlew --version || true
          echo "::endgroup::"

          echo "::group::Available Tasks (Top 20)"
          ./gradlew tasks --all 2>&1 | grep -E "^[a-zA-Z].* - " | head -n 20 || true
          echo "::endgroup::"

      - name: Build with Gradle
        id: gradle_build
        working-directory: ${{ steps.detect.outputs.root }}
        run: |
          echo "::group::Gradle Build"
          TASK="${{ github.event.inputs.build_task }}"
          FLAVOR="${{ github.event.inputs.build_flavor }}"

          if [ -n "$FLAVOR" ]; then
            CAP_FLAVOR="$(echo ${FLAVOR:0:1} | tr '[:lower:]' '[:upper:]')${FLAVOR:1}"
            FINAL_TASK="${TASK}${CAP_FLAVOR}"
          else
            FINAL_TASK="$TASK"
          fi

          echo "==========================================="
          echo "Running: ./gradlew $FINAL_TASK"
          echo "==========================================="

          ./gradlew "$FINAL_TASK" --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log
          EXIT_CODE=${PIPESTATUS[0]}

          echo "Exit code: $EXIT_CODE"
          echo "::endgroup::"

          exit $EXIT_CODE

      - name: Show Gradle Error (Kalau Gagal)
        if: failure()
        run: |
          echo "::group::Gradle Error (Last 100 lines)"
          if [ -f /tmp/gradle.log ]; then
            tail -n 100 /tmp/gradle.log
          else
            echo "Log file tidak ditemukan"
          fi
          echo "::endgroup::"

      - name: Locate APK/AAB Artifacts
        id: locate
        if: success()
        run: |
          echo "::group::Locate Artifacts"
          ROOT="${{ steps.detect.outputs.root }}"

          APK_DIR="$ROOT/app/build/outputs/apk"
          AAB_DIR="$ROOT/app/build/outputs/bundle"

          APKS=""
          AABS=""

          if [ -d "$APK_DIR" ]; then
            APKS=$(find "$APK_DIR" -name "*.apk" -type f)
          fi

          if [ -d "$AAB_DIR" ]; then
            AABS=$(find "$AAB_DIR" -name "*.aab" -type f)
          fi

          if [ -z "$APKS" ] && [ -z "$AABS" ]; then
            echo "::error::Tidak ada APK/AAB yang dihasilkan"
            echo "Isi app/build/outputs:"
            find "$ROOT/app/build/outputs" -type f 2>/dev/null | head -n 50 || true
            exit 1
          fi

          echo "apks<<EOF" >> $GITHUB_OUTPUT
          echo "$APKS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "aabs<<EOF" >> $GITHUB_OUTPUT
          echo "$AABS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "✓ APKs found:"
          echo "$APKS"
          echo "✓ AABs found:"
          echo "$AABS"
          echo "::endgroup::"

      - name: Generate Build Info
        if: always()
        run: |
          echo "::group::Build Info"
          {
            echo "=== NATIVE BUILD INFO ==="
            echo "Job ID: ${{ github.run_id }}"
            echo "Run Number: ${{ github.run_number }}"
            echo "Target Dir: ${{ github.event.inputs.target_dir }}"
            echo "Zip File: ${{ github.event.inputs.zip_file }}"
            echo "Build Task: ${{ github.event.inputs.build_task }}"
            echo "Build Flavor: ${{ github.event.inputs.build_flavor }}"
            echo "Java Version: ${{ github.event.inputs.java_version }}"
            echo "Project Root: ${{ steps.detect.outputs.root }}"
            echo "Commit: ${{ github.sha }}"
            echo "Actor: ${{ github.actor }}"
            echo "Finished: $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          } > BUILD_INFO.txt

          cat BUILD_INFO.txt
          echo "::endgroup::"

      - name: Upload APK
        if: success() && steps.locate.outputs.apks != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: |
            ${{ steps.detect.outputs.root }}/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload App Bundle
        if: success() && steps.locate.outputs.aabs != ''
        uses: actions/upload-artifact@v4
        with:
          name: appbundle-release
          path: |
            ${{ steps.detect.outputs.root }}/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload Build Info
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-info
          path: BUILD_INFO.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Gradle Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-log
          path: /tmp/gradle.log
          if-no-files-found: warn
          retention-days: 7

      - name: Summary
        if: always()
        run: |
          echo "## Native Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Job ID | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Task | ${{ github.event.inputs.build_task }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Flavor | ${{ github.event.inputs.build_flavor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java | ${{ github.event.inputs.java_version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
