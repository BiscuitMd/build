name: Flutter Build

on:
  workflow_dispatch:
    inputs:
      target_dir:
        description: 'Target directory'
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      
      - name: Build APK
        run: |
          cd ${{ github.event.inputs.target_dir }}
          flutter pub get
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: ${{ github.event.inputs.target_dir }}/build/app/outputs/flutter-apk/app-release.apk
